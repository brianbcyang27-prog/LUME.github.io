<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drink Menu & Search</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css" />
  <script src="main.js" defer></script>
</head>

<body class="bg-[#f8f9fa] min-h-screen flex flex-col items-center pb-16 overflow-x-hidden">

  <header class="w-full bg-[#1a1a1a] h-12 sticky top-0 flex items-center px-4 z-40 border-b-2 border-transparent shadow-md">
    <button id="menu-btn" class="flex flex-col gap-[4px] cursor-pointer pl-2 hover:opacity-70 transition-opacity" aria-label="Menu">
      <span class="w-7 h-1 bg-white block rounded-sm"></span>
      <span class="w-7 h-1 bg-white block rounded-sm"></span>
      <span class="w-7 h-1 bg-white block rounded-sm"></span>
    </button>
    <div class="absolute left-1/2 -translate-x-1/2 top-0 bg-[#1a1a1a] text-3xl px-5 py-1 pb-4 rounded-b-[5rem] shadow-lg">
      <img src="Image/logo/logo.png" class="w-20" alt="Logo" />
    </div>
  </header>

  <div id="mobile-menu" class="fixed inset-0 bg-[#1a1a1a]/95 backdrop-blur-sm z-50 transform -translate-x-full transition-transform duration-300 flex flex-col pt-24 px-12">
    <button id="close-menu-btn" class="absolute top-6 left-6 text-white text-5xl font-light hover:text-[#e04f43] transition-colors leading-none">×</button>
    <nav class="flex flex-col gap-8 text-white text-4xl font-bold mt-10">
      <a href="index.html#hero-section" class="menu-link hover:text-[#e04f43] transition-colors w-fit">Home</a>
      <a href="index.html#featured-section" class="menu-link hover:text-[#e04f43] transition-colors w-fit">Featured Drinks</a>
      <a href="index.html#aspects-section" class="menu-link hover:text-[#e04f43] transition-colors w-fit">Our Values</a>
      <a href="menu.html" class="menu-link text-[#e04f43] w-fit">Search Menu</a>
    </nav>
  </div>

  <div class="w-full max-w-6xl mx-auto px-6 mt-12 flex justify-between items-center relative z-10">
    <h1 class="text-2xl font-bold text-[#1a1a1a] ml-auto">Drink Search</h1>
  </div>

  <div class="w-full max-w-6xl mx-auto px-6 mt-4 relative z-10">
    <div class="bg-white p-4 md:p-6 flex flex-col md:flex-row gap-4 w-full shadow-lg rounded-2xl border border-gray-100">
      <div class="relative w-full md:w-1/3">
        <span class="absolute left-4 top-3.5 text-gray-400 text-lg">🔍</span>
        <input type="text" id="search-input" placeholder="Search for a drink..." 
               class="w-full bg-gray-50 pl-12 pr-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-[#e04f43]/50 focus:border-[#e04f43] transition-all font-medium text-[#1a1a1a]">
      </div>
      <div class="flex-1 flex items-center gap-2 overflow-x-auto pb-2 md:pb-0 scrollbar-hide">
        <button class="filter-pill active" data-filter="All">All</button>
        <button class="filter-pill" data-filter="Fruit Tea">Fruit Tea</button>
        <button class="filter-pill" data-filter="Milk Tea">Milk Tea</button>
        <button class="filter-pill" data-filter="Sparkling">Sparkling</button>
        <button class="filter-pill" data-filter="Slush">Slush</button>
      </div>
    </div>
  </div>

  <div id="menu-grid" class="w-full max-w-6xl mx-auto px-6 mt-12 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>

  <div id="shopping-cart" class="cart-hidden fixed top-24 right-6 w-80 bg-white p-6 rounded-2xl shadow-2xl border border-gray-100 z-50 transition-opacity duration-300">
    <h2 class="text-2xl font-extrabold text-[#1a1a1a] border-b pb-3 mb-4">Your Cart <span id="cart-count" class="text-[#e04f43]">(0)</span></h2>
    <ul id="cart-items-list" class="flex flex-col gap-3 mb-4 max-h-60 overflow-y-auto pr-2"></ul>
    <div class="flex justify-between items-center border-t pt-4 mb-6">
      <span class="text-lg font-bold text-gray-500">Total:</span>
      <span class="text-2xl font-extrabold text-[#1a1a1a]">$<span id="cart-total-price">0.00</span></span>
    </div>
    <button id="checkout-btn" class="w-full bg-[#e04f43] text-white font-bold text-lg py-3 rounded-xl hover:bg-[#c94338] transition-colors shadow-md">
      Checkout
    </button>
  </div>

  <div id="toast-container" class="fixed bottom-6 right-6 flex flex-col gap-3 z-50 pointer-events-none"></div>

</body>
</html>
